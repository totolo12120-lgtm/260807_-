        header {

            align-items: center;

            gap: 16px;
        }

            margin-top: 6px;

            display: flex;
            gap: 8px;
            flex-wrap: wrap;

            background: rgba(255, 255, 255, 0.15);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            backdrop-filter: blur(4px);

        .badge.live {
            background: #10B981;
            color: white;
        }

        main {
            max-width: 1300px;
            margin: 24px auto;
            padding: 0 20px;
            width: 100%;
            flex: 1;
        }

        .toolbar {
            background: var(--card-bg);

            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);

            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 16px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;

        .btn {

            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;

        .btn-primary {
            background-color: var(--primary-light);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        .btn-primary:hover {

            transform: translateY(-1px);

        .btn-success {
            background-color: var(--accent);
            color: white;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);

        .btn-success:hover {

            padding: 8px 16px;
            border-radius: 10px;

        function getAgencyClass(agency) {
            if (agency.includes("행정안전부")) return "mois";
            if (agency.includes("중소벤처기업부")) return "mss";
            if (agency.includes("고용노동부")) return "moel";
            return "";
        }

        function renderTable(data) {
            const tbody = document.getElementById("tableBody");
            tbody.innerHTML = "";
            data.forEach(row => {
                const tr = document.createElement("tr");
                tr.innerHTML = `
                    <td style="text-align: center;"><span class="tag-agency ${getAgencyClass(row.agency)}">${row.agency}</span></td>
                    <td style="font-weight: 600;">${row.title}</td>
                    <td style="text-align: center;"><span class="tag-keyword">${row.keyword}</span></td>
                    <td style="text-align: center; color: #64748B;">${row.regDate}</td>
                    <td style="text-align: center; color: #64748B;">${row.deadline}</td>
                    <td style="text-align: center;">
                        <a href="${row.link}" target="_blank" class="link-btn">열기 ↗</a>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        renderTable(initialData);

        document.getElementById("searchInput").addEventListener("input", function(e) {
            const query = e.target.value.toLowerCase().strip ? e.target.value.toLowerCase().strip() : e.target.value.toLowerCase().trim();
            const filtered = initialData.filter(row => 
                row.agency.toLowerCase().includes(query) ||
                row.title.toLowerCase().includes(query) ||
                row.keyword.toLowerCase().includes(query) ||
                row.regDate.includes(query) ||
                row.deadline.includes(query)
            );
            renderTable(filtered);
        });
